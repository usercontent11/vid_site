name: Debug image extraction

on:
  push:
    branches:
      - main
    paths:
      - image-debug/extract_images.py
      - .github/workflows/test-image-extraction.yml
  workflow_dispatch:
    inputs:
      page_path:
        description: "Source video path to scan (path only)"
        required: true
        default: "/videos/1193895"
        type: string

permissions:
  contents: write

concurrency:
  group: debug-image-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only the fetcher dependencies
        run: python -m pip install "requests>=2.32,<3" "psycopg[binary]>=3.2,<4"

      - name: Test extraction logic without network
        run: python image-debug/extract_images.py --self-test

      - name: Extract images and generate browsable HTML
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://mobilexh.live' }}
          SOURCE_COOKIE: ${{ secrets.SOURCE_COOKIE }}
          PAGE_PATH: ${{ inputs.page_path || '/videos/1193895' }}
        run: python image-debug/extract_images.py --path "$PAGE_PATH"

      - name: Commit the HTML test page (no Actions artifact)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/image-extraction-test.html
          if git diff --cached --quiet; then
            echo "The generated image gallery is unchanged; no commit was needed."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Generate image extraction debug gallery"
          git push
