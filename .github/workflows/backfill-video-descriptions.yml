name: Backfill video descriptions

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Database batch size (1-500).
        required: true
        type: number
        default: 100
      workers:
        description: Concurrent HTTP requests (1-8).
        required: true
        type: number
        default: 5
      max_videos:
        description: Maximum videos for this run; use 0 for all remaining.
        required: true
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: video-description-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || secrets.SITE_BASE_URL || 'https://mobilexh.live' }}
      SOURCE_COOKIE: ${{ secrets.SOURCE_COOKIE }}
      DESCRIPTION_BATCH_SIZE: ${{ inputs.batch_size }}
      DESCRIPTION_WORKERS: ${{ inputs.workers }}
      DESCRIPTION_MAX_VIDEOS: ${{ inputs.max_videos }}
      REQUEST_TIMEOUT_SECONDS: '30'
      DESCRIPTION_DIAGNOSTIC_DIR: diagnostic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Add DATABASE_URL in repository Actions secrets."; exit 1; }
          test -n "$SITE_BASE_URL" || { echo "::error::Set SITE_BASE_URL in Actions variables or secrets."; exit 1; }
          python - <<'PY'
          import os
          batch_size = int(os.environ["DESCRIPTION_BATCH_SIZE"])
          workers = int(os.environ["DESCRIPTION_WORKERS"])
          max_videos = int(os.environ["DESCRIPTION_MAX_VIDEOS"])
          if not 1 <= batch_size <= 500: raise SystemExit("batch_size must be 1..500")
          if not 1 <= workers <= 8: raise SystemExit("workers must be 1..8")
          if not 0 <= max_videos <= 2000000: raise SystemExit("max_videos must be 0..2000000")
          PY
      - name: Run syntax checks and tests
        run: |
          python -m compileall -q extractor.py description_extractor.py bulk_description_backfill.py
          python -m unittest discover -s tests -v
      - name: Backfill missing descriptions
        run: python bulk_description_backfill.py --batch-size "$DESCRIPTION_BATCH_SIZE" --workers "$DESCRIPTION_WORKERS" --max-videos "$DESCRIPTION_MAX_VIDEOS"
      - name: Upload initial-script diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: description-backfill-diagnostics-${{ github.run_id }}
          path: diagnostic/
          if-no-files-found: ignore
          retention-days: 3
