name: Test Flask video site

on:
  push:
    paths:
      - app.py
      - resolver.py
      - extractor.py
      - templates/**
      - static/**
      - tests/**
      - requirements.txt
      - scripts/**
      - .github/workflows/test-flask-site.yml
      - .github/workflows/inspect-source-video-page.yml
  pull_request:
    paths:
      - app.py
      - resolver.py
      - extractor.py
      - scripts/**
      - .github/workflows/inspect-source-video-page.yml
      - templates/**
      - static/**
      - tests/**
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py resolver.py tests/test_resolver.py
      - name: Run resolver tests
        run: python -m unittest discover -s tests -v
      - name: Import Flask app
        run: python -c "import app; print('Flask app imported successfully')"
