name: Test Flask video site

on:
  push:
    paths:
      - app.py
      - resolver.py
      - extractor.py
      - templates/**
      - static/**
      - tests/**
      - requirements.txt
      - scripts/**
      - .github/workflows/test-flask-site.yml
      - .github/workflows/inspect-source-video-page.yml
      - .github/workflows/probe-neon-source-page.yml
      - neon.ts
      - neon-functions/**
      - package.json
  pull_request:
    paths:
      - app.py
      - resolver.py
      - extractor.py
      - scripts/**
      - .github/workflows/inspect-source-video-page.yml
      - templates/**
      - static/**
      - tests/**
      - requirements.txt
      - neon.ts
      - neon-functions/**
      - package.json
      - .github/workflows/probe-neon-source-page.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node tooling
        run: npm install --no-audit --no-fund
      - name: Compile Neon Function and config
        run: |
          npx esbuild neon-functions/source-page-inspect.ts --platform=node --target=node24 --format=esm --outfile=/tmp/source-page-inspect.mjs
          npx esbuild neon.ts --bundle --platform=node --target=node24 --format=esm --external:@neon/config/v1 --outfile=/tmp/neon-config.mjs
          node tests/test_neon_inspector.mjs /tmp/source-page-inspect.mjs
      - name: Compile application
        run: python -m py_compile app.py resolver.py tests/test_resolver.py
      - name: Run resolver tests
        run: python -m unittest discover -s tests -v
      - name: Import Flask app
        run: python -c "import app; print('Flask app imported successfully')"
