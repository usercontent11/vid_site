name: Test video descriptions

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of videos to test (1-50).
        required: true
        type: number
        default: 5
      workers:
        description: Concurrent direct HTTP requests (1-8).
        required: true
        type: number
        default: 3

permissions:
  contents: read

jobs:
  test-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || secrets.SITE_BASE_URL || 'https://mobilexh.live' }}
      SOURCE_COOKIE: ${{ secrets.SOURCE_COOKIE }}
      DESCRIPTION_LIMIT: ${{ inputs.limit }}
      DESCRIPTION_WORKERS: ${{ inputs.workers }}
      REQUEST_TIMEOUT_SECONDS: '30'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Add DATABASE_URL in repository Actions secrets."; exit 1; }
          test -n "$SITE_BASE_URL" || { echo "::error::Set SITE_BASE_URL in Actions variables or secrets."; exit 1; }
          python - <<'PY'
          import os
          limit, workers = int(os.environ['DESCRIPTION_LIMIT']), int(os.environ['DESCRIPTION_WORKERS'])
          if not 1 <= limit <= 50: raise SystemExit('DESCRIPTION_LIMIT must be 1..50')
          if not 1 <= workers <= 8: raise SystemExit('DESCRIPTION_WORKERS must be 1..8')
          PY
      - name: Run syntax checks and tests
        run: |
          python -m compileall -q extractor.py description_extractor.py
          python -m unittest discover -s tests -v
      - name: Fetch a small description sample
        run: python description_extractor.py --limit "$DESCRIPTION_LIMIT" --workers "$DESCRIPTION_WORKERS"

      - name: Upload initial-script diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: description-initial-script-diagnostics-${{ github.run_id }}
          path: diagnostic/
          if-no-files-found: ignore
          retention-days: 3
