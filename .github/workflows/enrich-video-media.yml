name: Enrich video media

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Database batch size (1-5000)"
        required: true
        type: number
        default: 500
      concurrency:
        description: "Concurrent source-page requests (1-100)"
        required: true
        type: number
        default: 20
      max_videos:
        description: "Maximum videos this run; 0 means no application-level limit"
        required: true
        type: number
        default: 0
      dry_run:
        description: "Extract and report only; do not write to Neon"
        required: true
        type: boolean
        default: true
      refresh_existing:
        description: "Allow valid extracted paths to replace existing paths"
        required: true
        type: boolean
        default: false
      video_id:
        description: "Optional: diagnose one existing video ID (for example 1193895)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: video-media-enrichment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || secrets.SITE_BASE_URL || 'https://mobilexh.live' }}
      SOURCE_COOKIE: ${{ secrets.MOBILEXH_COOKIE_JAR || secrets.SOURCE_COOKIE }}
      MEDIA_BATCH_SIZE: ${{ inputs.batch_size }}
      MEDIA_CONCURRENCY: ${{ inputs.concurrency }}
      MEDIA_MAX_VIDEOS: ${{ inputs.max_videos }}
      MEDIA_MIN_REQUEST_INTERVAL: "0.15"
      REQUEST_TIMEOUT_SECONDS: "30"
      DRY_RUN: ${{ inputs.dry_run }}
      REFRESH_EXISTING: ${{ inputs.refresh_existing }}
      VIDEO_ID: ${{ inputs.video_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install existing project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate configuration and regression tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Add DATABASE_URL in repository Actions secrets."; exit 2; }
          test -n "$SITE_BASE_URL" || { echo "::error::Set SITE_BASE_URL in Actions variables or secrets."; exit 2; }
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          batch = int(os.environ["MEDIA_BATCH_SIZE"])
          concurrency = int(os.environ["MEDIA_CONCURRENCY"])
          maximum = int(os.environ["MEDIA_MAX_VIDEOS"])
          base = urlsplit(os.environ["SITE_BASE_URL"])
          if not 1 <= batch <= 5000: raise SystemExit("batch_size must be 1..5000")
          if not 1 <= concurrency <= 100: raise SystemExit("concurrency must be 1..100")
          if not 0 <= maximum <= 2000000: raise SystemExit("max_videos must be 0..2000000")
          if base.scheme != "https" or not base.hostname or base.username or base.password or base.query or base.fragment:
              raise SystemExit("SITE_BASE_URL must be a clean HTTPS origin")
          video_id = os.environ.get("VIDEO_ID", "").strip()
          if video_id and not video_id.isdigit(): raise SystemExit("video_id must be a non-negative integer")
          PY
          python -m py_compile media_enricher.py
          python -m unittest discover -s tests -v

      - name: Run media enrichment
        shell: bash
        run: |
          set -euo pipefail
          args=(--batch-size "$MEDIA_BATCH_SIZE" --concurrency "$MEDIA_CONCURRENCY" --max-videos "$MEDIA_MAX_VIDEOS")
          if [[ "$DRY_RUN" != "true" ]]; then
            args+=(--apply)
          fi
          if [[ "$REFRESH_EXISTING" == "true" ]]; then
            args+=(--refresh-existing)
          fi
          if [[ -n "$VIDEO_ID" ]]; then
            args+=(--video-id "$VIDEO_ID")
          fi
          python media_enricher.py "${args[@]}"
