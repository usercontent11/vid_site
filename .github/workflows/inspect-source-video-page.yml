name: Inspect source video page

on:
  push:
    branches:
      - main
    paths:
      - scripts/capture_source_page.py
      - .github/workflows/inspect-source-video-page.yml
  workflow_dispatch:
    inputs:
      page_path:
        description: "Source video path to inspect (path only, not a full URL)"
        required: true
        default: "/videos/xhfKO6H"
        type: string

permissions:
  contents: write

concurrency:
  group: inspect-source-video-page
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Capture sanitized HTML and structure report
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://mobilexh.live' }}
          SOURCE_COOKIE: ${{ secrets.SOURCE_COOKIE }}
          PAGE_PATH: ${{ inputs.page_path || '/videos/xhfKO6H' }}
        run: python scripts/capture_source_page.py "$PAGE_PATH"

      - name: Commit snapshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/source-page-response.html diagnostics/source-page-structure.json
          if git diff --cached --quiet; then
            echo "The stored snapshot is unchanged; no commit was needed."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Capture sanitized source page structure"
          git push
