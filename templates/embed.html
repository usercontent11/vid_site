<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{{ video.title }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="embed-body"><div class="embed-player"><div class="video-player" data-video-player data-stream-endpoint="/api/stream/{{ video.id }}"><video controls playsinline preload="none" {% if video.thumbnail_url %}poster="{{ video.thumbnail_url }}"{% endif %} aria-label="{{ video.title }}"></video><div class="player-overlay"><span class="play-symbol">▶</span><button class="button button-primary is-hidden" type="button" data-load-player>Try again</button><p data-player-status>The player will find the stream automatically.</p></div></div><p class="embed-title">{{ video.title }}</p></div><script src="/static/player.js" defer></script></body></html>
